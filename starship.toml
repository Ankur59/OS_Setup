#username
[username]
disabled = false
format = "[$user]($style) in "
style_root = "red bold"
style_user = "yellow bold"
show_always = true

#NODE js
[nodejs]
disabled = false
format = "via [$symbol$version]($style) "
symbol = " "
style = "bold green"# ~/.config/starship.toml

[aws]
disabled = false
format = 'on [$symbol$profile(\($region\))]($style) '
symbol = " "
style = "bold yellow"

[battery]
disabled = false
full_symbol = ""
charging_symbol = ""
discharging_symbol = ""
format = "[$symbol$percentage]($style) "
[[battery.display]]
threshold = 10
style = "red bold"

[character]
disabled = false
format = "$symbol "
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vicmd_symbol = "[❮](bold green)"

[memory_usage]
disabled = true
threshold = 75
format = "via $symbol[$ram( | $swap)]($style) "
style = "white bold dimmed"
symbol = " "

# Display Python virtual environment
[python]
symbol = "🐍 "

#Docker
[docker_context]
disabled = false
symbol = " "
style = "blue bold"
format = "via [$symbol$context]($style) "
only_with_files = true

#Time
[time]
disabled = true
format = "at [$time]($style) "
style = "bold yellow"
use_12hr = false
time_format = ""
utc_time_offset = "local"
time_range = "-"
